name: Generate Snake

on:
  schedule:
    # Run automatically every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: jitendrabeep
          outputs: |
            dist/github-snake.svg?color_snake=%23FF6B5B&color_dots=%23F4EDE0,%23D4C8B5,%237E8DAA,%233A4D73,%2314213D
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%23FF6B5B&color_dots=%2314213D,%231E2D4A,%233A4D73,%23D4C8B5,%23F4EDE0

      - name: Push Snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
