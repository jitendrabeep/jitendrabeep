name: Generate Profile SVG Assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/profile-cards.yml"

permissions:
  contents: write

jobs:
  generate-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure assets directory exists
        run: mkdir -p assets

      # 1. Overall Stats Card (Navy #14213D, Coral #FF6B5B, Cream #F4EDE0)
      - name: Generate GitHub Stats Card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: stats
          options: username=jitendrabeep&show_icons=true&bg_color=14213D&title_color=FF6B5B&icon_color=FF6B5B&text_color=F4EDE0&border_color=243354&hide_border=false
          path: assets/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Top Languages Card (Navy #14213D, Coral #FF6B5B, Cream #F4EDE0)
      - name: Generate Top Languages Card
        uses: stats-organization/github-readme-stats-action@v2
        continue-on-error: true
        with:
          card: top-langs
          options: username=jitendrabeep&layout=compact&langs_count=8&bg_color=14213D&title_color=FF6B5B&text_color=F4EDE0&border_color=243354&hide_border=false
          path: assets/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 3. Activity Graph Card
      - name: Generate Activity Graph Card
        uses: maurodesouza/github-readme-activity-graph-action@v1
        continue-on-error: true
        with:
          username: jitendrabeep
          options: bg_color=14213D&color=FF6B5B&line=FF6B5B&point=F4EDE0&area=true&area_color=1E2D4A&title_color=F4EDE0&hide_border=false&border_color=243354
          output_path: assets/activity-graph.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # 4. Profile Trophies
      - name: Generate Profile Trophies
        uses: ryo-ma/github-profile-trophy@master
        continue-on-error: true
        with:
          username: jitendrabeep
          output_path: assets/trophies.svg
          params: "&theme=radical&no-frame=true&no-bg=true&margin-w=4"

      # 5. Commit and push updated assets
      - name: Commit and Push Generated Assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git commit -m "chore(assets): update profile stats cards [skip ci]" || exit 0
          git push
